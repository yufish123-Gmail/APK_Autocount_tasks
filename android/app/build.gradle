plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.yufish.autocount'
    compileSdk 35
    defaultConfig {
        applicationId 'com.yufish.autocount'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packaging { jniLibs { useLegacyPackaging = true } }
    signingConfigs {
        localRelease {
            def propertiesFile = rootProject.file('../signing/keystore.properties')
            if (propertiesFile.exists()) {
                def signing = new Properties()
                propertiesFile.withInputStream { signing.load(it) }
                storeFile rootProject.file('../signing/autocount.jks')
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.localRelease
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.10'
        buildPython(rootProject.file('../.tooling/python-full/tools/python.exe').absolutePath)
        pip {
            install 'numpy==1.26.2'
            install 'opencv-python-headless==4.5.1.48'
        }
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'androidx.core:core-ktx:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
